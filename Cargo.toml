[package]
name = "vibecraft"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
cognitive_complexity = "warn"
expect_used = "deny"
too_many_lines = "warn"
unwrap_used = "deny"

[dependencies]
aes = "0.8"
chrono = "0.4"
flate2 = "1"
libc = "0.2"
lz4 = "1"
md-5 = "0.10"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
